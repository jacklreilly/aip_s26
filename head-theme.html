<!-- Browser-tab icon and "Add to Home Screen" support, as on dwv_f26. Paths are
     site-root-relative on purpose: Quarto rewrites them per page depth. Keep the
     colour in sync with manifest.webmanifest and icons/icon.tex. -->
<meta name="theme-color" content="#F6D85E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Policy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
